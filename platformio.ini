; PlatformIO Project Configuration File for M5Stack PaperS3
; Official M5 PaperS3 Configuration
; https://docs.platformio.org/page/projectconf.html

[env:PaperS3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

; Serial port and upload settings
upload_port = COM4
upload_speed = 921600
monitor_port = COM4
monitor_speed = 115200

; Build flags for M5Stack PaperS3
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Library dependencies
lib_deps =
    epdiy=https://github.com/vroland/epdiy.git#d84d26ebebd780c4c9d4218d76fbe2727ee42b47
    M5Unified=https://github.com/m5stack/M5Unified
    ArduinoJson @ ^7.0.0
